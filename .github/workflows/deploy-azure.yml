name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite lanzar manualmente

jobs:
  deploy:
    runs-on: windows-latest   # PowerShell nativo en Windows

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Generar manifest.json de galeria
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/generate-gallery.ps1

      - name: Deploy a Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'uncion-con-gloria'        # <- cambia por tu app name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '.'
